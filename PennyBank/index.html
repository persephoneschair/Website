<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1024">
  <title>The Penny Bank – Game Night</title>
  <meta name="description" content="Game Night's Penny Bank: season and all-time leaderboards, medal cabinets for every format, the Hall of Fame and every player's medal cabinet.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Penny Bank – Game Night">
  <meta property="og:description" content="Leaderboards, the Hall of Fame and every player's medal cabinet.">
  <meta property="og:image" content="https://persephoneschair.com/assets/img/og.jpg">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Satisfy&display=swap">
  <link rel="preload" href="/assets/fonts/GameOver.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>try{if(new FontFace('t','url(#)',{sizeAdjust:'330%'}).sizeAdjust!=='330%')throw 0}catch(e){document.documentElement.classList.add('no-size-adjust')}</script>
  <script src="/assets/js/site.js" defer></script>
  <script src="/assets/js/data.js" defer></script>
  <script src="/assets/js/pennybank.js" defer></script>
  <style>
    .tabs-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; margin-bottom: 28px; border-bottom: 1px solid var(--line-soft); }
    .tabs { display: flex; gap: 6px; overflow-x: auto; }
    .tab { min-height: 44px; padding: 0 16px; display: flex; align-items: center; border-radius: 10px; color: #C8D3F5; font-weight: 600; white-space: nowrap; }
    .tab:hover { color: #fff; background: var(--panel); }
    .tab[aria-current="page"] { background: var(--chip); color: var(--gold); font-weight: 700; }
    .find { position: relative; width: 300px; max-width: 100%; }
    .find .search { height: 44px; background: var(--panel); }
    .find-hint { position: absolute; top: 100%; left: 0; margin-top: 6px; font-size: 14px; color: var(--danger); }

    .head-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
    .controls .search { flex: 0 1 300px; height: 44px; }

    /* Podium */
    .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
    .podium a { display: flex; flex-direction: column; gap: 4px; padding: 22px 24px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--medal); border-radius: var(--radius-lg); color: var(--text); }
    .podium a:hover { border-color: var(--medal); color: var(--text); }
    .podium .p-rank { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--medal); }
    .podium .p-name { font-size: 22px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium .p-value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); }

    /* Tables (built from rows of links so every row is clickable) */
    .table { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .t-row { display: grid; grid-template-columns: var(--cols); align-items: center; gap: 12px; min-height: 48px; padding: 0 22px; border-top: 1px solid #18234C; color: var(--text); font-variant-numeric: tabular-nums; }
    a.t-row:hover { background: var(--panel-2); color: var(--text); }
    .t-head { min-height: 50px; border-top: 0; background: var(--panel-2); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .t-foot { min-height: 56px; border-top: 2px solid var(--line-2); background: var(--panel-2); font-weight: 700; }
    .t-rank { font-weight: 700; color: var(--muted); }
    .t-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-num { font-weight: 700; text-align: right; }
    .t-num.zero { color: #3A4775; }
    .t-total { color: var(--gold); }
    .t-row.top-1 .t-rank { color: var(--medal-gold); }
    .t-row.top-2 .t-rank { color: var(--medal-silver); }
    .t-row.top-3 .t-rank { color: var(--medal-bronze); }
    .t-head .t-num { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
    .disc { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; background: var(--disc); }
    .t-mix { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--chip); }
    .t-mix span { display: block; height: 100%; }
    .lb-cols { --cols: 64px minmax(0, 1fr) 140px; }
    .medal-cols { --cols: 64px minmax(0, 1fr) repeat(4, 72px) 80px; }
    .cabinet-cols { --cols: minmax(0, 1fr) repeat(4, 72px) 80px minmax(120px, 1fr); }
    .score-cols { --cols: minmax(0, 1fr) 120px 90px; }

    /* Format picker */
    .format-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .format-picker a { min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--line-2); color: #C8D3F5; font-size: 14px; font-weight: 600; }
    .format-picker a:hover { border-color: var(--muted); color: #fff; }
    .format-picker a[aria-current="page"] { background: var(--gold); border-color: var(--gold); color: var(--bg-2); font-weight: 700; }
    .format-select { display: none; width: 100%; margin-bottom: 20px; }

    /* Player cabinet */
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat { padding: 20px 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; gap: 4px; }
    .stat-label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .stat-value { font-size: clamp(26px, 2.6vw, 36px); font-weight: 700; font-variant-numeric: tabular-nums; color: #fff; }
    .stat-sub { font-size: 14px; color: var(--text-2); }
    .section-title { margin: 36px 0 14px; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .section-title:first-child { margin-top: 0; }

    .skeleton-row { height: 48px; margin-bottom: 8px; }

    @media (max-width: 959px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .stat { padding: 14px 16px; }
    }
    @media (max-width: 700px) {
      .tabs-bar { margin-bottom: 20px; }
      .tab { padding: 0 12px; font-size: 14px; }
      .find { width: 100%; }
      .controls .search { flex-basis: 100%; }
      .controls .segmented { width: 100%; }
      .controls .segmented button { flex: 1 1 0; padding: 0 6px; font-size: 14px; }
      .podium { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .podium a { flex-direction: row; align-items: center; gap: 12px; padding: 12px 16px; border-top-width: 1px; border-left: 4px solid var(--medal); }
      .podium .p-rank { width: 34px; font-size: 13px; }
      .podium .p-name { flex: 1 1 auto; font-size: 17px; }
      .podium .p-value { font-size: 18px; }
      .t-row { gap: 6px; padding: 0 12px; min-height: 50px; font-size: 15px; }
      .t-head { font-size: 11px; letter-spacing: 0.06em; }
      .lb-cols { --cols: 40px minmax(0, 1fr) auto; }
      .medal-cols { --cols: 36px minmax(0, 1fr) repeat(4, 26px) 34px; }
      .cabinet-cols { --cols: minmax(0, 1fr) repeat(4, 26px) 34px; }
      .t-mix, .t-mix-head { display: none; }
      .t-head .label { display: none; }
      .score-cols { --cols: minmax(0, 1fr) auto 44px; }
      .format-picker { display: none; }
      .format-select { display: block; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Game Night home">
        <img src="/assets/img/logo.png" alt="" width="44" height="44">
        <span class="display d-brand" aria-hidden="true">Game Night</span>
      </a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="header-menu" id="site-menu">
        <nav class="site-nav" aria-label="Main">
          <a href="/OnDemand/">Watch</a>
          <a href="/PlayAGame/">Play</a>
          <a href="/PennyBank/" aria-current="page">Penny Bank</a>
        </nav>
        <div class="header-actions">
          <a class="btn btn-ghost" href="https://discord.gg/persephoneschair" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Discord</a>
          <a class="btn btn-live" href="https://twitch.tv/royal_flush" target="_blank" rel="noopener"><span class="live-dot" aria-hidden="true"></span>Watch Live</a>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="wrap">
    <div class="page-head" id="page-head">
      <div>
        <h1 class="display d-page">The Penny Bank</h1>
      </div>
    </div>

    <div class="tabs-bar">
      <nav class="tabs" aria-label="Penny Bank sections">
        <a class="tab" href="/PennyBank/" data-nav data-tab="leaderboard">Leaderboard</a>
        <a class="tab" href="/PennyBank/?view=formats" data-nav data-tab="formats">Medal Cabinets</a>
        <a class="tab" href="/PennyBank/?view=hof" data-nav data-tab="hof">Hall of Fame</a>
      </nav>
      <form class="find" id="find" role="search" autocomplete="off">
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <span class="visually-hidden">Find a player's medal cabinet</span>
          <input type="search" id="find-input" list="player-names" placeholder="Find a player's cabinet">
        </label>
        <datalist id="player-names"></datalist>
        <span class="find-hint" id="find-hint" role="status"></span>
      </form>
    </div>

    <div id="view" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 2026 Persephone's Chair</span>
      <nav aria-label="Elsewhere">
        <a href="https://twitch.tv/royal_flush" target="_blank" rel="noopener">Twitch</a>
        <a href="https://discord.gg/persephoneschair" target="_blank" rel="noopener">Discord</a>
        <a href="https://q-forge.persephoneschair.com" target="_blank" rel="noopener">Q-Forge</a>
      </nav>
    </div>
  </footer>
</body>
</html>
