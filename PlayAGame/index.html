<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play a Game</title>
  <link rel="icon" href="../Images/Icon.png" type="image/png">
  <style>
    .home-btn-wrapper {
      display: flex;
      align-items: flex-start;
    }
    @media (max-width: 600px) {
      .home-btn-wrapper {
        justify-content: center;
      }
      .home-btn {
        margin-left: 0;
        margin-right: 0;
      }
    }
        .home-btn {
          display: inline-block;
          margin: 2rem 0 0 2rem;
          background: #152a5a;
          color: #fff;
          border: 2px solid #2563eb;
          border-radius: 12px;
          padding: 1.2rem 2.5rem;
          font-size: 1.5rem;
          font-family: 'Segoe UI', sans-serif;
          font-weight: 700;
          text-align: center;
          text-decoration: none;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
          transition: all 0.15s ease;
          position: relative;
          overflow: hidden;
          cursor: pointer;
        }
        .home-btn:hover, .home-btn:focus {
          box-shadow: 0 0 25px rgba(243, 236, 64, 1);
          transform: scale(1.05);
          border-color: #f3ec40;
          background: #0b3797;
          color: #fff;
        }
    @font-face {
      font-family: 'Game Over';
      src: url('../Fonts/Game Over.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    html, body {
      background: #0a0a0a !important;
      color: #fff;
      font-family: 'Montserrat', Arial, sans-serif;
      min-height: 100vh;
      height: 100%;
      margin: 0;
      box-sizing: border-box;
    }
    .center-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100vw;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: #f3ec40;
      text-transform: uppercase;
      font-size: 12rem;
      font-family: 'Game Over', sans-serif;
      letter-spacing: 0.1em;
      text-shadow:
        -2px -2px 0 #1e3a8a,
        2px -2px 0 #1e3a8a,
        -2px 2px 0 #1e3a8a,
        2px 2px 0 #1e3a8a,
        -2px 0 0 #1e3a8a,
        2px 0 0 #1e3a8a,
        0 -2px 0 #1e3a8a,
        0 2px 0 #1e3a8a;
      transition: opacity 0.15s ease;
    }
    .format-cards {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      align-items: center;
    }
    .format-card {
      background: #152a5a;
      border: 2px solid #2563eb;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      color: #fff;
      width: 100%;
      max-width: 480px;
      min-width: 220px;
      transition: all 0.2s cubic-bezier(.4,2,.3,1);
      overflow: hidden;
      cursor: pointer;
      outline: none;
      padding: 0;
      display: block;
      text-decoration: none;
    }
    .format-card:hover {
      border-color: #f3ec40;
      box-shadow: 0 0 25px #f3ec40, 0 4px 10px rgba(0,0,0,0.5);
      background: #0b3797;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1.2rem 1.2rem 1.2rem 1.2rem;
      min-height: 80px;
    }
    .card-thumb {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 2px 8px #000a;
      background: #222;
    }
    .card-title {
      font-size: 1.6rem;
      font-weight: 700;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      flex: 1;
      letter-spacing: 0.04em;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 3.5rem;
      }
      .center-wrapper {
        padding: 0;
      }
      /* Ensure the Home button is centered on small screens. This must
         come after the general .home-btn rules so it overrides left margin. */
      .home-btn {
        display: block;
        margin: 2rem auto 0 auto;
      }
      .format-card {
        max-width: 98vw;
      }
      .card-header {
        padding: 0.7rem 0.7rem 0.7rem 0.7rem;
      }
      .card-title {
        font-size: 1.1rem;
      }
      .card-thumb {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>
<body>
    <div class="home-btn-wrapper">
      <a href="../index.html" class="home-btn">Home</a>
    </div>
  <div class="center-wrapper">
    <h1>Play a Game</h1>
    <div class="format-cards">
      <a class="format-card" href="https://theescapeartist.persephoneschair.com" target="_blank" rel="noopener">
        <div class="card-header">
          <img class="card-thumb" src="../Images/EscapeArtist.png" alt="The Escape Artist">
          <span class="card-title">The Escape Artist</span>
        </div>
      </a>
      <a class="format-card" href="https://riskybusiness.persephoneschair.com" target="_blank" rel="noopener">
        <div class="card-header">
          <img class="card-thumb" src="../Images/RiskyBusiness.png" alt="Risky Business">
          <span class="card-title">Risky Business</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
