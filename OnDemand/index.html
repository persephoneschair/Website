<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1024">
  <title>On Demand – Game Night</title>
  <meta name="description" content="Watch every episode of Game Night by Persephone's Chair, season by season.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Game Night On Demand">
  <meta property="og:description" content="Every episode of Game Night, from Season 1 to now.">
  <meta property="og:image" content="https://persephoneschair.com/assets/img/og.jpg">
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Satisfy&display=swap">
  <link rel="preload" href="/assets/fonts/GameOver.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>try{if(new FontFace('t','url(#)',{sizeAdjust:'330%'}).sizeAdjust!=='330%')throw 0}catch(e){document.documentElement.classList.add('no-size-adjust')}</script>
  <script src="/assets/js/site.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>
  <script src="/assets/js/data.js" defer></script>
  <script src="/assets/js/ondemand.js" defer></script>
  <style>
    .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px; margin-bottom: 28px; }
    .filters .search { flex: 1 1 280px; }
    .filters .field { flex: 0 1 auto; }
    .filters .clear-btn { background: none; border: 0; padding: 0 6px; min-height: 44px; color: var(--gold); font-weight: 700; cursor: pointer; }
    .filters .clear-btn:hover { color: var(--gold-hover); }

    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .ep-skeleton { height: 360px; border-radius: 18px; }

    @media (max-width: 640px) {
      .filters { padding: 12px; gap: 10px; }
      .filters .search { flex-basis: 100%; }
      .filters .field { flex: 1 1 calc(50% - 5px); min-width: 0; height: 46px; font-size: 15px; }
      .filters .toggle { flex: 1 1 auto; height: 40px; font-size: 14px; }
      .ep-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .ep-skeleton { height: 94px; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Game Night home">
        <img src="/assets/img/logo.png" alt="" width="44" height="44">
        <span class="display d-brand" aria-hidden="true">Game Night</span>
      </a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="header-menu" id="site-menu">
        <nav class="site-nav" aria-label="Main">
          <a href="/OnDemand/" aria-current="page">Watch</a>
          <a href="/PlayAGame/">Play</a>
          <a href="/PennyBank/">Penny Bank</a>
        </nav>
        <div class="header-actions">
          <a class="btn btn-ghost" href="https://discord.gg/persephoneschair" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Discord</a>
          <a class="btn btn-live" href="https://twitch.tv/royal_flush" target="_blank" rel="noopener"><span class="live-dot" aria-hidden="true"></span>Watch Live</a>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="wrap">
    <div class="page-head">
      <div>
        <h1 class="display d-page">On Demand</h1>
        <p class="lede">Every episode of Game Night, from Season 1 to now.</p>
      </div>
      <p class="muted" id="result-count" aria-live="polite"></p>
    </div>

    <form class="panel filters" role="search" id="filters" onsubmit="return false">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span class="visually-hidden">Search episodes</span>
        <input type="search" id="q" placeholder="Search titles, authors, guests" autocomplete="off">
      </label>
      <select class="field" id="season" aria-label="Season"><option>Loading seasons…</option></select>
      <select class="field" id="format" aria-label="Format"><option value="">All formats</option></select>
      <select class="field" id="sort" aria-label="Sort order">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
      <button type="button" class="toggle" id="guests" aria-pressed="false">Guest appearance</button>
      <button type="button" class="toggle" id="features" aria-pressed="false">Feature episode</button>
      <button type="button" class="clear-btn" id="clear" hidden>Clear filters</button>
    </form>

    <div id="episodes" class="ep-grid" aria-busy="true"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 2026 Persephone's Chair</span>
      <nav aria-label="Elsewhere">
        <a href="https://twitch.tv/royal_flush" target="_blank" rel="noopener">Twitch</a>
        <a href="https://discord.gg/persephoneschair" target="_blank" rel="noopener">Discord</a>
        <a href="https://q-forge.persephoneschair.com" target="_blank" rel="noopener">Q-Forge</a>
      </nav>
    </div>
  </footer>
</body>
</html>
