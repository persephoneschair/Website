  <style>
    .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px; margin-bottom: 28px; }
    .filters .search { flex: 1 1 280px; }
    .filters .field { flex: 0 1 auto; }
    .filters .clear-btn { background: none; border: 0; padding: 0 6px; min-height: 44px; color: var(--gold); font-weight: 700; cursor: pointer; }
    .filters .clear-btn:hover { color: var(--gold-hover); }

    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .ep-skeleton { height: 360px; border-radius: 18px; }

    @media (max-width: 640px) {
      .filters { padding: 12px; gap: 10px; }
      .filters .search { flex-basis: 100%; }
      .filters .field { flex: 1 1 calc(50% - 5px); min-width: 0; height: 46px; font-size: 15px; }
      .filters .toggle { flex: 1 1 auto; height: 40px; font-size: 14px; }
      .ep-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .ep-skeleton { height: 94px; border-radius: 14px; }
    }
  </style>

      <a class="account-slot" href="https://login.persephoneschair.com/">Sign in</a>

  </header>

  <main id="main" class="wrap">
    <div class="page-head">
      <div>
        <h1 class="display d-page">On Demand</h1>
        <p class="lede">Every episode of Game Night, from Season 1 to now.</p>
      </div>
      <p class="muted" id="result-count" aria-live="polite"></p>
    </div>

    <form class="panel filters" role="search" id="filters" onsubmit="return false">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span class="visually-hidden">Search episodes</span>
        <input type="search" id="q" placeholder="Search titles, authors, guests" autocomplete="off">
      </label>
      <select class="field" id="season" aria-label="Season"><option>Loading seasons…</option></select>
      <select class="field" id="format" aria-label="Format"><option value="">All formats</option></select>
      <select class="field" id="sort" aria-label="Sort order">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
      <button type="button" class="toggle" id="guests" aria-pressed="false">Guest appearance</button>
      <button type="button" class="toggle" id="features" aria-pressed="false">Feature episode</button>
      <button type="button" class="clear-btn" id="clear" hidden>Clear filters</button>
    </form>

    <div id="episodes" class="ep-grid" aria-busy="true"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© 2026 Persephone's Chair</span>
      <nav aria-label="Elsewhere">
        <a href="https://twitch.tv/royal_flush" target="_blank" rel="noopener">Twitch</a>
