<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1024">
  <title>Page not found – Game Night</title>
  <script>
    (function () {
      // This host is case-sensitive, so mistyped-case URLs (e.g. /ondemand)
      // 404 instead of matching the real folder (/OnDemand). It also has a
      // few short vanity paths. Both are handled here rather than as real
      // folders, since a folder that differs only by case from an existing
      // one can't be checked out alongside it on a case-insensitive
      // filesystem (Windows/NTFS). Runs in <head> so the 404 content never
      // flashes before a redirect.
      var redirects = {
        'ondemand': '/OnDemand/',
        'watch': '/OnDemand/',
        'pennybank': '/PennyBank/',
        'unicon': '/UniCon/',
        'downloads': '/PlayAGame/',
        'play': '/PlayAGame/',
        'playagame': '/PlayAGame/',
        'q-forge': 'https://q-forge.persephoneschair.com',
        'qforge': 'https://q-forge.persephoneschair.com',
        'theescapeartist': 'https://theescapeartist.persephoneschair.com',
        'escapeartist': 'https://theescapeartist.persephoneschair.com',
        'riskybusiness': 'https://riskybusiness.persephoneschair.com',
        'risky-business': 'https://riskybusiness.persephoneschair.com'
      };
      var path = window.location.pathname
        .toLowerCase()
        .replace(/^\/+|\/+$/g, '')
        .replace(/\/index\.html$/, '');
      if (Object.prototype.hasOwnProperty.call(redirects, path)) {
        var target = redirects[path];
        // Keep query strings for on-site pages (e.g. /pennybank?player=x).
        if (target.charAt(0) === '/') target += window.location.search + window.location.hash;
        window.location.replace(target);
      }
    })();
  </script>
  <link rel="icon" href="/assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>try{if(new FontFace('t','url(#)',{sizeAdjust:'330%'}).sizeAdjust!=='330%')throw 0}catch(e){document.documentElement.classList.add('no-size-adjust')}</script>
  <script src="/assets/js/site.js" defer></script>
  <style>
    .lost { padding: clamp(48px, 10vw, 120px) 0; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
    .lost .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Game Night home">
        <img src="/assets/img/logo.png" alt="" width="44" height="44">
        <span class="display d-brand" aria-hidden="true">Game Night</span>
      </a>
      <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="header-menu" id="site-menu">
        <nav class="site-nav" aria-label="Main">
          <a href="/OnDemand/">Watch</a>
          <a href="/PlayAGame/">Play</a>
          <a href="/PennyBank/">Penny Bank</a>
        </nav>
        <div class="header-actions">
          <a class="btn btn-ghost" href="https://discord.gg/persephoneschair" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Discord</a>
          <a class="btn btn-live" href="https://twitch.tv/royal_flush" target="_blank" rel="noopener"><span class="live-dot" aria-hidden="true"></span>Watch Live</a>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="wrap lost">
    <p class="eyebrow">Error 404</p>
    <h1 class="display d-page">Game over</h1>
    <p class="lede">We couldn't find that page. It may have moved, or the link might be mistyped.</p>
    <div class="actions">
      <a class="btn btn-primary btn-lg" href="/">Back to the homepage</a>
      <a class="btn btn-outline btn-lg" href="/OnDemand/">Browse episodes</a>
    </div>
  </main>
</body>
</html>
